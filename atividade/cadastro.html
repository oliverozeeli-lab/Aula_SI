<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Login - PETSHOP</title>
</head>
<body bgcolor="#FFF8F0">
    <header style="background-color:#F4A261; padding:25px; text-align:center;">
        <h1 style="font-family:Arial; color:white; margin:0;">
            PETSHOP
        </h1>
    </header>
    <section style="width:400px; margin:60px auto; background-color:white; padding:35px; border-radius:18px;">
        <h2 style="font-family:Arial; color:#E76F51; text-align:center; margin-top:0;">
            ENTRAR
        </h2>
        <p style="font-family:Arial; color:#777777; text-align:center; font-size:14px;">
            Entre na sua conta para continuar suas compras.
        </p>
        <br>
        <form action="#" method="post">
            <label for="email" style="font-family:Arial; color:#333333; font-size:14px;">
                E-mail
            </label>
            <br>
            <input type="email"
                id="email"
                name="email"
                placeholder="Digite seu e-mail"
                maxlength="100"
                required
                style="box-sizing:border-box; width:100%; height:42px; margin-top:8px; padding:10px; border:1px solid #E0C5B5; border-radius:8px; font-family:Arial; font-size:14px;">
            <br><br>
            <label for="senha" style="font-family:Arial; color:#333333; font-size:14px;">
                Senha
            </label>
            <br>
            <input type="password"
                id="senha"
                name="senha"
                placeholder="Digite sua senha"
                maxlength="30"
                required
                style="box-sizing:border-box; width:100%; height:42px; margin-top:8px; padding:10px; border:1px solid #E0C5B5; border-radius:8px; font-family:Arial; font-size:14px;">
            <br><br>
            <p style="font-family:Arial; text-align:right; margin:0;">
                <a href="#"
                    style="color:#E76F51; text-decoration:none; font-size:13px;">
                    Esqueci minha senha
                </a>
            </p>
            <br><br>
            <input type="submit"
                value="ENTRAR"
                style="width:100%; height:45px; background-color:#F47B20; color:white; border:none; border-radius:10px; font-family:Arial; font-size:15px; font-weight:bold; cursor:pointer;">
        </form>
        <br>
        <p style="font-family:Arial; text-align:center; color:#777777; font-size:14px;">
            Ainda não possui uma conta?
        </p>
        <p style="text-align:center;">
            <a href="cadastro.html"
                style="font-family:Arial; color:#E76F51; text-decoration:none; font-weight:bold; font-size:14px;">
                CRIAR UMA CONTA
            </a>
        </p>
    </section>
</body>
</html>
